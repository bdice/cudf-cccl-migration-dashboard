name: Dashboard

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q
      - name: Fetch cuDF history
        if: github.event_name != 'pull_request'
        run: git clone --filter=blob:none --no-checkout https://github.com/NVIDIA/cudf.git cudf
      - name: Generate dashboard and migration batches
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python migration_status.py --repo cudf --base-ref origin/main --output-dir site
          python plan_batches.py --report site/migration_status.json
          cp site/migration_status.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
